[build]
  # Static site — no build step. Serve files from the repo root.
  publish = "."
  command = ""

# Send every unmatched path to index.html (single-page friendly, 200 not 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
